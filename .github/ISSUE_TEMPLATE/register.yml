name: 회원 등록 (전용 레포지토리 생성)
description: no-ai-gym 멤버 초대 및 개인 전용 레포지토리를 생성합니다.
title: "[회원등록] 전용 레포지토리 생성 신청"
labels: ["new-member"]
body:
  - type: markdown
    attributes:
      value: |
        아래 **Submit new issue** 버튼을 누르면 `no-ai-gym/본인아이디` 레포지토리가 자동 생성되고 초대장이 발송됩니다.
  - type: checkboxes
    id: rules
    attributes:
      label: 이용 수칙 동의
      options:
        - label: AI 자동완성 및 코드 생성 도구 없이 직접 작성한 코드만 업로드하겠습니다.
          required: true
