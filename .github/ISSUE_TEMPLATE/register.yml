name: 🏋️ 신규 회원 등록
description: No-AI Gym 회원을 등록하고 개인 전용 레포지토리를 발급받습니다.
title: "[회원등록] 신규 라커 발급 신청"
labels: ["new-member"]
body:
  - type: markdown
    attributes:
      value: |
        ### 환영합니다!
        아래 **Submit new issue** 버튼을 누르시면 키오스크 봇이 본인의 GitHub 아이디로 된 개인 라커(`no-ai-gym/본인아이디`)와 회원 초대장을 자동 발급해 드립니다.
  - type: checkboxes
    id: rules
    attributes:
      label: 헬스장 이용 수칙 동의
      options:
        - label: AI 자동완성 및 코드 생성 도구 없이 순수 근육(직접 타이핑)으로만 운동하겠습니다.
          required: true
