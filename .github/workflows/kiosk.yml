name: 회원 등록 자동화

on:
  issues:
    types: [opened]

concurrency:
  group: member-registration
  cancel-in-progress: false

jobs:
  register-member:
    if: contains(github.event.issue.labels.*.name, 'new-member') || startsWith(github.event.issue.title, '[회원등록]')
    runs-on: ubuntu-latest
    steps:
      - name: 회원 등록 및 전용 레포지토리 생성
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.KIOSK_TOKEN }}
          script: |
            const org = context.repo.owner;
            const username = context.payload.issue.user.login;
            const issueNumber = context.issue.number;

            // 1. 이미 레포지토리가 생성된 회원인지 확인
            try {
              await github.rest.repos.get({ owner: org, repo: username });
              await github.rest.issues.createComment({
                owner: org,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `⚠️ **${username}**님은 이미 전용 레포지토리([${org}/${username}](https://github.com/${org}/${username}))를 보유하고 있습니다.`
              });
              await github.rest.issues.update({
                owner: org,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed'
              });
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            // 2. gym-template을 복사하여 개인 레포지토리 생성
            await github.rest.repos.createUsingTemplate({
              template_owner: org,
              template_repo: 'gym-template',
              owner: org,
              name: username,
              description: `${username}'s no-ai-gym repository`,
              private: false,
              include_all_branches: false
            });

            await new Promise(resolve => setTimeout(resolve, 2000));

            // 3. 오거나이제이션 회원 초대장 발송
            try {
              await github.rest.orgs.setMembershipForUser({
                org: org,
                username: username,
                role: 'member'
              });
            } catch (e) {
              console.log('이미 조직 멤버/오너이거나 초대 생략:', e.message);
            }

            // 4. 본인 레포지토리에 쓰기/관리 권한(maintain) 부여
            await github.rest.repos.addCollaborator({
              owner: org,
              repo: username,
              username: username,
              permission: 'maintain'
            });

            // 5. 완료 안내 댓글 작성 및 이슈 종료
            await github.rest.issues.createComment({
              owner: org,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `✅ **${username}**님의 회원 등록 및 레포지토리 생성이 완료되었습니다.`,
                ``,
                `* **생성된 레포지토리:** [${org}/${username}](https://github.com/${org}/${username})`,
                ``,
                `아래 두 초대를 모두 수락해야 해당 레포지토리에 push할 수 있습니다.`,
                `1. [no-ai-gym 오거나이제이션 초대 수락](https://github.com/orgs/${org}/invitation)`,
                `2. [레포지토리 쓰기 권한 초대 수락](https://github.com/${org}/${username}/invitations)`
              ].join('\n')
            });

            await github.rest.issues.update({
              owner: org,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
